name: Deploy spider-solitaire page

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/spider-solitaire/**'
      - 'packages/arcade-theme/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: publish-gh-pages
  queue: max

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: pnpm/action-setup@v2
        with:
          version: 9.5.0

      - name: Build and deploy
        run: |
          cd ./packages/spider-solitaire
          pnpm install --frozen-lockfile
          pnpm run build
          echo "==========Move dist to root=========="
          mkdir -p ../../dist/spider-solitaire
          cp -r dist/* ../../dist/spider-solitaire

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true  # 保留之前构建的文件
