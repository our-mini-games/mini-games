<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mini-games/arkanoid.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>打砖块</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="arcade-title">打砖块</h1>
        <button class="arcade-button btn-back">返回</button>
        <button class="arcade-button arcade-button--primary btn-ctrl">开始游戏</button>
        <button class="arcade-button btn-restart">重新开始</button>
      </header>
      <main class="arkanoid arcade-table" aria-label="打砖块游戏区"></main>
      <footer class="footer">
        <div class="controls">
          <div class="target" aria-hidden="true">···</div>
        </div>
        <p class="control-hint">拖动滑块，或用 ← → 移动挡板</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
